<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wazzer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <header class="top-header">
    <h1 class="main-title">WAZZER</h1>
    <button id="themeToggle" class="theme-btn">Light Mode</button>
  </header>

  <div class="app-wrapper">
    <div class="dashboard-container">
      
      <section class="left-panel">
        
        <div class="card">
          <h3>Current Pulse</h3>
          <div class="value-display">
            <span id="pulseValue">75</span>
            <span class="unit">BPM</span>
          </div>
          <input type="range" min="40" max="140" value="75" id="pulseSlider" class="custom-slider main-slider">
        </div>

        <div class="card">
          <h3>Emergency Water Temps</h3>
          
          <div class="water-control">
            <div class="control-header">
              <span>Low HR Water:</span>
              <span class="temp-value cool-temp"><span id="lowHrValue">34</span>°C</span>
            </div>
            <input type="range" min="15" max="45" value="34" id="lowHrSlider" class="custom-slider cold-slider">
          </div>

          <div class="water-control">
            <div class="control-header">
              <span>Regular HR Water:</span>
              <span class="temp-value warm-temp"><span id="regularHrValue">38</span>°C</span>
            </div>
            <input type="range" min="15" max="45" value="38" id="regularHrSlider" class="custom-slider regular-slider">
          </div>

          <div class="water-control">
            <div class="control-header">
              <span>High HR Water:</span>
              <span class="temp-value hot-temp"><span id="highHrValue">40</span>°C</span>
            </div>
            <input type="range" min="15" max="45" value="40" id="highHrSlider" class="custom-slider hot-slider">
          </div>
        </div>
      </section>

      <section class="right-panel">
        <div class="card h-full">
          <h3>Emergency Contacts</h3>
          <p class="card-subtitle">Notify these contacts if a fall is detected.</p>
          
          <div class="contact-inputs">
            <input type="text" placeholder="Full Name" id="fullName" class="custom-input">
            <input type="tel" placeholder="Phone Number" id="phone" class="custom-input">
            <button onclick="addContact()" class="action-btn">Add Contact</button>
          </div>
          
          <ul id="contactList" class="contact-list">
             </ul>
        </div>
      </section>

    </div>
  </div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
